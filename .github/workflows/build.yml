name: Build jar
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q AlucardBoss-Forge-1.20.1.zip
      - name: Fix author text
        run: sed -i 's/^mod_authors=.*/mod_authors=HyperSoulPH (original addon), ported by Claude/' AlucardBoss-Forge-1.20.1/gradle.properties
      - name: Build
        working-directory: AlucardBoss-Forge-1.20.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Publish jar as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls AlucardBoss-Forge-1.20.1/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release delete jar --yes --cleanup-tag || true
          gh release create jar "$JAR" --title "Alucard jar" --notes "Download the .jar below"
